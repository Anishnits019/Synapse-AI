name: synapse ai deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # --- GATEWAY ---
      - name: Build Gateway
        run: |
          docker buildx build \
            -f backend/gateway/Dockerfile \
            --platform linux/amd64 \
            -t gateway:latest \
            --load Backend

      - name: Tag Gateway
        run: |
          docker tag gateway:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      - name: Push Gateway
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      # --- AUTH ---
      - name: Build Auth
        run: |
          docker buildx build \
            -f backend/services/auth/Dockerfile \
            --platform linux/amd64 \
            -t auth-service:latest \
            --load Backend

      - name: Tag Auth
        run: |
          docker tag auth-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest

      - name: Push Auth
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest

      # --- CHAT ---
      - name: Build Chat
        run: |
          docker buildx build \
            -f backend/services/chat/Dockerfile \
            --platform linux/amd64 \
            -t chat-service:latest \
            --load Backend

      - name: Tag Chat
        run: |
          docker tag chat-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest

      - name: Push Chat
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest

      # --- AGENT ---
      - name: Build Agent
        run: |
          docker buildx build \
            -f backend/services/agent/Dockerfile \
            --platform linux/amd64 \
            -t agent-service:latest \
            --load Backend

      - name: Tag Agent
        run: |
          docker tag agent-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest

      - name: Push Agent
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest

      # --- BILLING ---
      - name: Build Billing
        run: |
          docker buildx build \
            -f backend/services/billing/Dockerfile \
            --platform linux/amd64 \
            -t billing-service:latest \
            --load Backend

      - name: Tag Billing
        run: |
          docker tag billing-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest

      - name: Push Billing
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest

      # --- ECS DEPLOYMENTS ---
      - name: Deploy Gateway
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.GATEWAY }} \
            --force-new-deployment

      - name: Deploy Auth
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AUTH_SERVICE }} \
            --force-new-deployment

      - name: Deploy Chat
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.CHAT_SERVICE }} \
            --force-new-deployment

      - name: Deploy Agent
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AGENT_SERVICE }} \
            --force-new-deployment

      - name: Deploy Billing
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.BILLING_SERVICE }} \
            --force-new-deployment

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build FrontEnd
        run: |
          cd Frontend
          npm install
          npm run build

      - name: AWS Configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync \
            Frontend/dist \
            s3://${{ secrets.S3_BUCKET }} \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"